services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # 1. Takes the API URL from the host system environment, defaults to local port 4000
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      # 2. Uses your cloud database variable passed down from your root environment
      - DATABASE_URL=${DATABASE_URL:-mysql://admin:admin1234@mysql:3306/projectmanager}
      - REDIS_URL=redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8.0
    container_name: projectmanagementtool
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin1234
      MYSQL_DATABASE: projectmanager
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin1234
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-padmin1234",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysqldata:
